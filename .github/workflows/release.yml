name: release

# Publishes a release when a tag is pushed, all or nothing: the release job checks every asset,
# every slice and every checksum before it creates the release (scripts/release-publish.sh), and
# an asset that fails any check stops the run with nothing published.
#   v0.1.0-pdfium8100                    full release: PDFium (3 slices, EmbedPDF patches), QPDF (3 slices), notices
#   v0.0.1-pdfium8100-stock-macos-only   pre-release: stock PDFium for macOS only
# Manual runs (Actions tab, "Run workflow") do the whole build and the gate in dry-run mode by
# default: nothing is published. A run with dry run unticked must be started from the tag itself
# ("Use workflow from": the tag), so the release is built from the tag's own commit; from any other
# ref the plan job fails. To retry a failed tag run, use "Re-run failed jobs" on that run.
# Only one real release job per tag runs at a time (concurrency group release-<tag>). Every dry run has a group
# of its own (release-dry-<run id>), so a dry run can neither wait behind nor cancel a real release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check, for example v0.1.0-pdfium8100 (it does not need to exist for a dry run)"
        required: true
        type: string
      dry_run:
        description: "Check everything but publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Read the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      macos_only: ${{ steps.tag.outputs.macos_only }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the tag against versions.env
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release-tag.sh "$TAG" | tee -a "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Only the two release shapes that have a build exist
        env:
          STOCK: ${{ steps.tag.outputs.stock }}
          MACOS_ONLY: ${{ steps.tag.outputs.macos_only }}
        run: |
          if [ "$STOCK" = true ] && [ "$MACOS_ONLY" != true ]; then
            echo "::error::a -stock release with iOS slices has no build; use -stock-macos-only or drop -stock"
            exit 1
          fi
          if [ "$STOCK" != true ] && [ "$MACOS_ONLY" = true ]; then
            echo "::error::-macos-only releases are stock builds; the tag must end in -stock-macos-only"
            exit 1
          fi
      - name: A real release builds the tag itself
        id: mode
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true) ;;
            false)
              if [ "$REF" != "refs/tags/$TAG" ]; then
                echo "::error::a real release must be built from the tag itself, but this run is from $REF: start the workflow from the tag $TAG (Use workflow from: Tags), push the tag, or use Re-run failed jobs on the tag's own run"
                exit 1
              fi
              ;;
            *)
              echo "::error::dry run is '$DRY_RUN', neither true nor false"
              exit 1
              ;;
          esac
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      include_patched: ${{ needs.plan.outputs.macos_only != 'true' }}
    permissions:
      contents: read

  release:
    name: Check and publish
    needs: [plan, build]
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    # One real release job per tag at a time; a second one waits instead of racing the first one's draft. GitHub
    # cancels a pending job in a group when a newer one queues, so a dry run (which never calls gh and cannot
    # race a draft) gets a group of its own, keyed on its run id: a dry-run dispatch queued while a real release
    # job waits must never cancel the real one.
    concurrency:
      group: ${{ needs.plan.outputs.dry_run == 'true' && format('release-dry-{0}', github.run_id) || format('release-{0}', needs.plan.outputs.tag) }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      MACOS_ONLY: ${{ needs.plan.outputs.macos_only }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      XCODE_APP: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Download the stock macOS XCFramework
        if: needs.plan.outputs.macos_only == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-stock-macos-arm64
          path: dist
      - name: Download the three-slice PDFium XCFramework
        if: needs.plan.outputs.macos_only != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-xcframework
          path: dist
      - name: Download the QPDF XCFramework
        if: needs.plan.outputs.macos_only != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qpdf-xcframework
          path: dist
      - name: Download the license notices
        if: needs.plan.outputs.macos_only != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: licenses-*
          path: work/licenses
      - name: Assemble LICENSES.zip
        if: needs.plan.outputs.macos_only != 'true'
        run: |
          set -euo pipefail
          ls work/licenses
          RELEASE_TAG="$TAG" scripts/licenses.sh assemble work/licenses/*
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          if [ "$MACOS_ONLY" = true ]; then
            scripts/checksums.sh write dist PDFium.xcframework.zip
          else
            scripts/checksums.sh write dist PDFium.xcframework.zip QPDF.xcframework.zip LICENSES.zip
          fi
      - name: The gate must refuse a corrupted copy
        run: |
          set -euo pipefail
          rm -rf work/corrupt && mkdir -p work/corrupt
          cp dist/*.zip dist/checksums.txt work/corrupt/
          printf 'X' >> work/corrupt/PDFium.xcframework.zip
          # The refusal must be the checksum check's (exit 1, naming the file): a missing tool (exit 2), a crash
          # or another check failing first would prove nothing about the corrupted copy.
          code=0
          DIST_DIR="$PWD/work/corrupt" scripts/release-publish.sh "$TAG" --dry-run > work/corrupt-gate.log 2>&1 || code=$?
          if [ "$code" -ne 1 ] \
            || ! grep -q 'checksums.txt does not match the files' work/corrupt-gate.log \
            || ! grep -q 'PDFium.xcframework.zip: FAILED' work/corrupt-gate.log; then
            echo "::error::the release gate did not refuse the corrupted PDFium.xcframework.zip with its checksum check (exit $code, want 1); its output follows"
            cat work/corrupt-gate.log
            exit 1
          fi
          cat work/corrupt-gate.log
          echo "the gate refused the corrupted copy, as it must"
      - name: Check everything, publish only when nothing is wrong
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true) scripts/release-publish.sh "$TAG" --dry-run ;;
            false) scripts/release-publish.sh "$TAG" ;;
            *)
              echo "::error::the plan job's dry run output is '$DRY_RUN', neither true nor false; nothing is published"
              exit 1
              ;;
          esac
