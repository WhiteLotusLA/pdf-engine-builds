name: release

# Publishes a pre-release when a tag is pushed. Task A2 supports only stock macOS-only pre-releases
# (tags like v0.0.1-pdfium8086-stock-macos-only); the full release with every slice comes with task A6.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    name: Read the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      stock: ${{ steps.tag.outputs.stock }}
      macos_only: ${{ steps.tag.outputs.macos_only }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the tag against versions.env
        id: tag
        run: |
          set -euo pipefail
          scripts/release-tag.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Only stock macOS-only pre-releases exist so far
        env:
          STOCK: ${{ steps.tag.outputs.stock }}
          MACOS_ONLY: ${{ steps.tag.outputs.macos_only }}
        run: |
          if [ "$STOCK" != true ] || [ "$MACOS_ONLY" != true ]; then
            echo "::error::only -stock-macos-only tags can be released until plan task A6 is done"
            exit 1
          fi

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    name: Publish the pre-release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the stock XCFramework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-stock-macos-arm64
          path: assets
      - name: Write and check checksums.txt
        run: |
          set -euo pipefail
          find assets -type f | sort
          scripts/checksums.sh write assets PDFium.xcframework.zip
          scripts/checksums.sh verify assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "PDFium XCFramework built by GitHub Actions from commit $GITHUB_SHA."
            echo
            echo "Stock PDFium (no EmbedPDF patches), macOS arm64 only. Build info:"
            echo
            sed 's/^/    /' assets/slices/macos-arm64/BUILD-INFO.txt
          } > assets/release-notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file assets/release-notes.md ${flags[@]+"${flags[@]}"} \
            assets/PDFium.xcframework.zip assets/checksums.txt
      - name: Download the published assets and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify --pattern PDFium.xcframework.zip --pattern checksums.txt
          scripts/checksums.sh verify verify
          unzip -l verify/PDFium.xcframework.zip | awk '{print $4}' | grep -qx 'PDFium.xcframework/Info.plist'
