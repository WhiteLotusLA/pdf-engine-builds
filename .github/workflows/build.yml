name: build

# Builds PDFium and runs the smoke tests on standard GitHub-hosted macOS runners.
# Push to main (except documentation-only pushes), manual runs (gh workflow run build.yml --ref <branch>) and
# release.yml run the heavy jobs. Pull requests only run the quick self-tests.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      include_patched:
        description: Also build and test the EmbedPDF-patched variant
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  XCODE_APP: /Applications/Xcode_27.0.app
  WORK_DIR: ${{ github.workspace }}/work
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  self-tests:
    name: Self-tests (macOS)
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image (see README, Runner and Xcode)"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Run every self-test
        run: |
          for t in scripts/tests/*-test.sh; do
            echo "== $t"
            bash "$t"
          done

  pdfium-stock:
    name: PDFium stock, macOS arm64
    if: github.event_name != 'pull_request'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Build libpdfium.a (stock, no EmbedPDF patches)
        run: scripts/pdfium-build.sh macos-arm64
      - name: Verify the library
        run: scripts/pdfium-verify-lib.sh dist/slices/macos-arm64/libpdfium.a
      - name: Pack PDFium.xcframework
        run: scripts/pdfium-xcframework.sh
      - name: Smoke test
        run: smoke/pdfium/run-smoke.sh dist/PDFium.xcframework
      - name: Upload the XCFramework and build info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-stock-macos-arm64
          path: |
            dist/PDFium.xcframework.zip
            dist/slices/macos-arm64/BUILD-INFO.txt
            dist/slices/macos-arm64/args.gn
          if-no-files-found: error
          retention-days: 30

  pdfium-embedpdf:
    name: PDFium with EmbedPDF patches, macOS arm64
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: The committed patches must match the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git --version
          scripts/pdfium-patches-export.sh --check
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Apply the pdfium-binaries and EmbedPDF patches (all or nothing)
        run: scripts/pdfium-patches-apply.sh
      - name: Upload the patch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-report
          path: |
            dist/patch-report.txt
            work/patch-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Build libpdfium.a with the patches
        run: scripts/pdfium-build.sh macos-arm64 --embedpdf
      - name: Verify the library
        run: scripts/pdfium-verify-lib.sh dist/slices/macos-arm64/libpdfium.a --embedpdf
      - name: Pack PDFium.xcframework
        run: scripts/pdfium-xcframework.sh --embedpdf
      - name: Smoke test, including EPDFPage_ApplyRedactions
        run: smoke/pdfium/run-smoke.sh dist/PDFium.xcframework --embedpdf
      - name: Upload the XCFramework and build info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-embedpdf-macos-arm64
          path: |
            dist/PDFium.xcframework.zip
            dist/slices/macos-arm64/BUILD-INFO.txt
            dist/slices/macos-arm64/args.gn
            dist/patch-report.txt
          if-no-files-found: error
          retention-days: 30

  pdfium-embedpdf-tests:
    name: EmbedPDF tests, macOS arm64
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Apply the pdfium-binaries and EmbedPDF patches (all or nothing)
        run: scripts/pdfium-patches-apply.sh
      - name: Build and run the fork's tests
        run: scripts/pdfium-tests.sh macos-arm64
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedpdf-test-results
          path: dist/test-results/
          if-no-files-found: warn
          retention-days: 90
