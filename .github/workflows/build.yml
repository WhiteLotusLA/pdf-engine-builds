name: build

# Builds PDFium and runs the smoke tests on standard GitHub-hosted macOS runners.
# Push to main (except documentation-only pushes), manual runs (gh workflow run build.yml --ref <branch>) and
# release.yml run the heavy jobs. Pull requests only run the quick self-tests.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      include_patched:
        description: Also build and test the EmbedPDF-patched variant (it also gates the qpdf jobs)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  XCODE_APP: /Applications/Xcode_27.0.app
  WORK_DIR: ${{ github.workspace }}/work
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  self-tests:
    name: Self-tests (macOS)
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image (see README, Runner and Xcode)"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install xcodegen (the iPad smoke app test needs it)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run every self-test
        run: |
          for t in scripts/tests/*-test.sh; do
            echo "== $t"
            bash "$t"
          done

  pdfium-stock:
    name: PDFium stock, macOS arm64
    if: github.event_name != 'pull_request'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Build libpdfium.a (stock, no EmbedPDF patches)
        run: scripts/pdfium-build.sh macos-arm64
      - name: Verify the library
        run: scripts/pdfium-verify-lib.sh dist/slices/macos-arm64/libpdfium.a
      - name: Pack PDFium.xcframework
        run: scripts/pdfium-xcframework.sh
      - name: Smoke test
        run: smoke/pdfium/run-smoke.sh dist/PDFium.xcframework
      - name: Upload the XCFramework and build info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-stock-macos-arm64
          path: |
            dist/PDFium.xcframework.zip
            dist/slices/macos-arm64/BUILD-INFO.txt
            dist/slices/macos-arm64/args.gn
          if-no-files-found: error
          retention-days: 30

  pdfium-embedpdf:
    name: PDFium with EmbedPDF patches, macOS arm64
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: The committed patches must match the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git --version
          scripts/pdfium-patches-export.sh --check
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Apply the pdfium-binaries and EmbedPDF patches (all or nothing)
        run: scripts/pdfium-patches-apply.sh
      - name: Upload the patch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-report
          path: |
            dist/patch-report.txt
            work/patch-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Build libpdfium.a with the patches
        run: scripts/pdfium-build.sh macos-arm64 --embedpdf
      - name: Verify the library
        run: scripts/pdfium-verify-lib.sh dist/slices/macos-arm64/libpdfium.a --embedpdf
      - name: Pack PDFium.xcframework
        run: scripts/pdfium-xcframework.sh --embedpdf
      - name: Smoke test, including EPDFPage_ApplyRedactions
        run: smoke/pdfium/run-smoke.sh dist/PDFium.xcframework --embedpdf
      - name: Upload the XCFramework and build info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-embedpdf-macos-arm64
          path: |
            dist/PDFium.xcframework.zip
            dist/slices/macos-arm64/BUILD-INFO.txt
            dist/slices/macos-arm64/args.gn
            dist/patch-report.txt
          if-no-files-found: error
          retention-days: 30
      # The notices come last, so a notice problem can never hide the engine's build, smoke and artifact evidence.
      - name: Stage the PDFium license notices
        run: scripts/licenses.sh stage-pdfium work/pdfium work/pdfium/out/macos-arm64 dist/licenses-stage/pdfium-macos-arm64
      - name: Upload the PDFium license notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses-pdfium-macos-arm64
          path: dist/licenses-stage/pdfium-macos-arm64/
          if-no-files-found: error
          retention-days: 30

  pdfium-embedpdf-tests:
    name: EmbedPDF tests, macOS arm64
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: Check out PDFium at the pinned branch
        run: scripts/pdfium-checkout.sh
      - name: Apply the pdfium-binaries and EmbedPDF patches (all or nothing)
        run: scripts/pdfium-patches-apply.sh
      - name: Build and run the fork's tests
        run: scripts/pdfium-tests.sh macos-arm64
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedpdf-test-results
          path: dist/test-results/
          if-no-files-found: warn
          retention-days: 90

  pdfium-embedpdf-ios:
    name: PDFium with EmbedPDF patches, ${{ matrix.slice }}
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        slice: [ios-arm64, iossim-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
      - name: Check out PDFium (macOS and iOS dependencies) at the pinned branch
        env:
          PDFIUM_TARGET_OS_LIST: mac ios
        run: scripts/pdfium-checkout.sh
      - name: Apply the pdfium-binaries and EmbedPDF patches (all or nothing)
        run: scripts/pdfium-patches-apply.sh
      - name: Build libpdfium.a for ${{ matrix.slice }}
        run: scripts/pdfium-build.sh ${{ matrix.slice }} --embedpdf
      - name: Verify the library and its platform
        run: |
          set -euo pipefail
          scripts/pdfium-verify-lib.sh dist/slices/${{ matrix.slice }}/libpdfium.a --embedpdf
          platform="$(scripts/lib-platform.sh dist/slices/${{ matrix.slice }}/libpdfium.a)"
          echo "built for: $platform"
          case "${{ matrix.slice }}" in
            ios-arm64) want="IOS $IOS_MIN" ;;
            iossim-arm64) want="IOSSIMULATOR $IOS_MIN" ;;
          esac
          [ "$platform" = "$want" ] || { echo "::error::wanted $want"; exit 1; }
      - name: Upload the slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-slice-${{ matrix.slice }}
          path: dist/slices/${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 30
      # The notices come last, so a notice problem can never hide the slice and its evidence.
      - name: Stage the PDFium license notices
        run: scripts/licenses.sh stage-pdfium work/pdfium work/pdfium/out/${{ matrix.slice }} dist/licenses-stage/pdfium-${{ matrix.slice }}
      - name: Upload the PDFium license notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses-pdfium-${{ matrix.slice }}
          path: dist/licenses-stage/pdfium-${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 30

  pdfium-xcframework:
    name: PDFium.xcframework with three slices, iPad smoke app
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: [pdfium-embedpdf, pdfium-embedpdf-ios]
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Download the macOS slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-embedpdf-macos-arm64
          path: work/macos
      - name: Download the iOS device slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-slice-ios-arm64
          path: dist/slices/ios-arm64
      - name: Download the iOS simulator slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfium-slice-iossim-arm64
          path: dist/slices/iossim-arm64
      - name: Merge the three slices into PDFium.xcframework
        run: scripts/pdfium-xcframework-merge.sh work/macos/PDFium.xcframework.zip
      - name: iPad smoke app on the simulator (iossim-arm64 slice)
        run: smoke/pdfium/ios-app/run.sh simulator
      - name: iPad smoke app for a device (ios-arm64 slice)
        run: smoke/pdfium/ios-app/run.sh device
      - name: Upload the three-slice XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-xcframework
          path: dist/PDFium.xcframework.zip
          if-no-files-found: error
          retention-days: 30

  qpdf-slice:
    name: qpdf, ${{ matrix.slice }}
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: self-tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [macos-arm64, ios-arm64, iossim-arm64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install GnuTLS on purpose (the build must ignore it)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew list gnutls >/dev/null 2>&1 || brew install gnutls
      - name: Build libjpeg-turbo and qpdf for ${{ matrix.slice }}
        run: scripts/qpdf-build.sh ${{ matrix.slice }}
      - name: Smoke test against the macOS slice alone
        if: matrix.slice == 'macos-arm64'
        run: smoke/qpdf/run-smoke.sh macos-arm64 out/qpdf
      - name: Native crypto survives a poisoned environment
        if: matrix.slice == 'macos-arm64'
        run: scripts/tests/qpdf-poison-ci.sh
      - name: Stage the qpdf and libjpeg-turbo license notices
        if: matrix.slice == 'macos-arm64'
        run: scripts/licenses.sh stage-qpdf dist/licenses-stage/qpdf
      - name: Upload the qpdf and libjpeg-turbo license notices
        if: matrix.slice == 'macos-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses-qpdf
          path: dist/licenses-stage/qpdf/
          if-no-files-found: error
          retention-days: 30
      - name: Upload the slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qpdf-slice-${{ matrix.slice }}
          path: out/qpdf/${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 30

  qpdf-xcframework:
    name: QPDF.xcframework, smoke tests
    if: github.event_name != 'pull_request' && format('{0}', inputs.include_patched) != 'false'
    needs: qpdf-slice
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Download the macOS slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qpdf-slice-macos-arm64
          path: out/qpdf/macos-arm64
      - name: Download the iOS device slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qpdf-slice-ios-arm64
          path: out/qpdf/ios-arm64
      - name: Download the iOS simulator slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qpdf-slice-iossim-arm64
          path: out/qpdf/iossim-arm64
      - name: Create and verify QPDF.xcframework
        run: scripts/qpdf-xcframework.sh
      - name: No GnuTLS or OpenSSL symbol in any slice, native provider present
        run: |
          set -euo pipefail
          for id in macos-arm64 ios-arm64 ios-arm64-simulator; do
            scripts/check-no-tls-symbols.sh --require-native "dist/QPDF.xcframework/$id/libqpdf.a"
          done
      - name: Smoke test on macOS (AES-256 round trip, page labels, structural check)
        run: smoke/qpdf/run-smoke.sh macos-arm64
      - name: Smoke program links for the iOS device
        run: smoke/qpdf/run-smoke.sh ios-arm64
      - name: Smoke program runs inside an iPad simulator
        run: smoke/qpdf/run-smoke.sh iossim-arm64
      - name: Upload QPDF.xcframework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qpdf-xcframework
          path: dist/QPDF.xcframework.zip
          if-no-files-found: error
          retention-days: 30
